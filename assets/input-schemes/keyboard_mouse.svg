<svg xmlns="http://www.w3.org/2000/svg" width="320" height="150" viewBox="0 0 320 150">
  <title>Keyboard and mouse - WASD moves, the mouse aims, the click shoots</title>
  <defs>
    <rect id="k" width="15" height="20" rx="3" fill="#23233f" stroke="#4a4a6a" stroke-width="1"/>
    <rect id="kon" width="15" height="20" rx="3" fill="#0f0"/>
  </defs>

  <rect width="320" height="150" fill="#0a0a1a"/>
  <rect x="8" y="16" width="188" height="114" rx="8" fill="#14142a" stroke="#3c3c5a" stroke-width="2"/>

  <!-- the number row - 1 and 2 are the abilities -->
  <use href="#kon" x="18" y="24"/>
  <use href="#kon" x="35" y="24"/>
  <use href="#k" x="52" y="24"/>
  <use href="#k" x="69" y="24"/>
  <use href="#k" x="86" y="24"/>
  <use href="#k" x="103" y="24"/>
  <use href="#k" x="120" y="24"/>
  <use href="#k" x="137" y="24"/>
  <use href="#k" x="154" y="24"/>
  <use href="#k" x="171" y="24"/>

  <!-- the top letter row - W moves up -->
  <use href="#k" x="18" y="50"/>
  <use href="#kon" x="35" y="50"/>
  <use href="#k" x="52" y="50"/>
  <use href="#k" x="69" y="50"/>
  <use href="#k" x="86" y="50"/>
  <use href="#k" x="103" y="50"/>
  <use href="#k" x="120" y="50"/>
  <use href="#k" x="137" y="50"/>
  <use href="#k" x="154" y="50"/>
  <use href="#k" x="171" y="50"/>

  <!-- the home row - A, S and D move -->
  <use href="#kon" x="26" y="76"/>
  <use href="#kon" x="43" y="76"/>
  <use href="#kon" x="60" y="76"/>
  <use href="#k" x="77" y="76"/>
  <use href="#k" x="94" y="76"/>
  <use href="#k" x="111" y="76"/>
  <use href="#k" x="128" y="76"/>
  <use href="#k" x="145" y="76"/>
  <use href="#k" x="162" y="76"/>

  <!-- the bottom row -->
  <use href="#k" x="18" y="102"/>
  <use href="#k" x="35" y="102"/>
  <use href="#k" x="52" y="102"/>
  <use href="#k" x="69" y="102"/>
  <use href="#k" x="86" y="102"/>
  <use href="#k" x="103" y="102"/>
  <use href="#k" x="120" y="102"/>
  <rect x="137" y="102" width="49" height="20" rx="3" fill="#23233f" stroke="#4a4a6a" stroke-width="1"/>

  <g font-family="monospace" font-size="7" text-anchor="middle">
    <text x="25" y="37" fill="#062008">1</text>
    <text x="42" y="37" fill="#062008">2</text>
    <text x="59" y="37" fill="#8a8aa8">3</text>
    <text x="76" y="37" fill="#8a8aa8">4</text>
    <text x="93" y="37" fill="#8a8aa8">5</text>
    <text x="110" y="37" fill="#8a8aa8">6</text>
    <text x="127" y="37" fill="#8a8aa8">7</text>
    <text x="144" y="37" fill="#8a8aa8">8</text>
    <text x="161" y="37" fill="#8a8aa8">9</text>
    <text x="178" y="37" fill="#8a8aa8">0</text>

    <text x="25" y="63" fill="#8a8aa8">Q</text>
    <text x="42" y="63" fill="#062008">W</text>
    <text x="59" y="63" fill="#8a8aa8">E</text>
    <text x="76" y="63" fill="#8a8aa8">R</text>
    <text x="93" y="63" fill="#8a8aa8">T</text>
    <text x="110" y="63" fill="#8a8aa8">Y</text>
    <text x="127" y="63" fill="#8a8aa8">U</text>
    <text x="144" y="63" fill="#8a8aa8">I</text>
    <text x="161" y="63" fill="#8a8aa8">O</text>
    <text x="178" y="63" fill="#8a8aa8">P</text>

    <text x="33" y="89" fill="#062008">A</text>
    <text x="50" y="89" fill="#062008">S</text>
    <text x="67" y="89" fill="#062008">D</text>
    <text x="84" y="89" fill="#8a8aa8">F</text>
    <text x="101" y="89" fill="#8a8aa8">G</text>
    <text x="118" y="89" fill="#8a8aa8">H</text>
    <text x="135" y="89" fill="#8a8aa8">J</text>
    <text x="152" y="89" fill="#8a8aa8">K</text>
    <text x="169" y="89" fill="#8a8aa8">L</text>

    <text x="25" y="115" fill="#8a8aa8">Z</text>
    <text x="42" y="115" fill="#8a8aa8">X</text>
    <text x="59" y="115" fill="#8a8aa8">C</text>
    <text x="76" y="115" fill="#8a8aa8">V</text>
    <text x="93" y="115" fill="#8a8aa8">B</text>
    <text x="110" y="115" fill="#8a8aa8">N</text>
    <text x="127" y="115" fill="#8a8aa8">M</text>
  </g>

  <!-- the mouse: it aims and the click shoots -->
  <rect x="226" y="40" width="60" height="90" rx="28" fill="#20203a" stroke="#0f0" stroke-width="2"/>
  <line x1="256" y1="40" x2="256" y2="66" stroke="#0f0" stroke-width="2"/>
  <rect x="232" y="52" width="18" height="10" rx="5" fill="#0f0"/>
  <rect x="258" y="52" width="18" height="10" rx="5" fill="#2a2a45"/>

  <!-- the crosshair it aims at -->
  <g stroke="#0f0" stroke-width="2" fill="none">
    <circle cx="300" cy="28" r="8"/>
    <line x1="288" y1="28" x2="293" y2="28"/>
    <line x1="307" y1="28" x2="312" y2="28"/>
    <line x1="300" y1="16" x2="300" y2="21"/>
    <line x1="300" y1="35" x2="300" y2="40"/>
  </g>
  <line x1="258" y1="42" x2="291" y2="29" stroke="#0f0" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="160" y="142" font-family="monospace" font-size="8" text-anchor="middle" fill="#8a8aa8">click shoots   1 / 2 abilities</text>
</svg>
